name: Bug report
description: Report a wrong rotation, missing ability, UI bug or error.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please fill in as much as possible.
  - type: input
    id: version
    attributes:
      label: RotationCore version
      description: Release tag or `## Version:` from the .toc.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: class-spec
    attributes:
      label: Class / spec
      placeholder: "Death Knight — Unholy"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the wrong recommendation or bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
  - type: textarea
    id: error
    attributes:
      label: Error output / screenshots
      description: Paste any Lua error or `/rc selfcheck` output, and screenshots.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I verified the spell id against wotlkdb.com (if relevant).
        - label: I searched existing issues first.
          required: true
