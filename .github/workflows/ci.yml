name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Static verification
        run: python3 RotationCore/verify.py

      - name: Lua behavior tests
        run: python3 tests/run_tests.py

      - name: Lua syntax check (compile only)
        run: |
          python3 - <<'PY'
          import sys, glob
          import lupa
          L = lupa.LuaRuntime()
          load = L.eval("load")
          files = glob.glob("RotationCore/**/*.lua", recursive=True)
          bad = 0
          for f in sorted(files):
              src = open(f, encoding="utf-8").read()
              res = load(src, "@" + f)
              if isinstance(res, tuple):
                  fn, err = (res + (None, None))[:2]
              else:
                  fn, err = res, None
              if fn is None:
                  print("FAIL", f, err)
                  bad += 1
          print(f"compiled {len(files)} files, {bad} failures")
          sys.exit(1 if bad else 0)
          PY

      - name: Release build (dry run)
        run: python3 scripts/build_release.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Lua
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"

      - name: Set up LuaRocks
        uses: leafo/gh-actions-luarocks@v4

      - name: Install luacheck
        run: luarocks install luacheck

      - name: Luacheck (tests + new core modules)
        run: luacheck tests RotationCore/RotationCore/Diagnostics.lua RotationCore/RotationCore/Feedback.lua RotationCore/RotationCore/Schema.lua RotationCore/RotationCore/Simulation.lua RotationCore/RotationCore/Registration.lua RotationCore/RotationCore/KnownSpells.lua RotationCore/RotationCore/SharedSettings.lua RotationCore/RotationCore/Profiles.lua RotationCore/RotationCore/Events.lua RotationCore/RotationCore/BossProfiles.lua RotationCore/RotationCore/BossTimeline.lua RotationCore/RotationCore/CustomAPL.lua RotationCore/RotationCore/Analytics.lua RotationCore/RotationCore/OptionsIO.lua RotationCore/RotationCore/SpellFrameExtras.lua

      - name: StyLua (tests + new core modules)
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check tests RotationCore/RotationCore/Diagnostics.lua RotationCore/RotationCore/Feedback.lua RotationCore/RotationCore/Schema.lua RotationCore/RotationCore/Simulation.lua RotationCore/RotationCore/Registration.lua RotationCore/RotationCore/KnownSpells.lua RotationCore/RotationCore/SharedSettings.lua RotationCore/RotationCore/Profiles.lua RotationCore/RotationCore/Events.lua RotationCore/RotationCore/BossProfiles.lua RotationCore/RotationCore/BossTimeline.lua RotationCore/RotationCore/CustomAPL.lua RotationCore/RotationCore/Analytics.lua RotationCore/RotationCore/OptionsIO.lua RotationCore/RotationCore/SpellFrameExtras.lua
